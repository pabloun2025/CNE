name: Comprobar letras F/M (solo lectura)

# Recuentos sin datos personales: rótulos, archivos de recibos y estado de las colas de envío.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          ssh -i ~/.ssh/oracle -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109 \
            'sudo docker exec -i cne-prod-cne-postgres-1 psql -X -U cne_owner -d cne -At -F " | "' <<'SQL'
          BEGIN READ ONLY;
          SELECT 'Modo: ' || modo FROM cne.configuracion WHERE id = 1;
          SELECT 'Rótulo guardado | serie junta | fichas activas';
          SELECT coalesce(upper(substring(m.rotulo_credencial from '^\s*([A-Za-z])')), '(vacío)'), j.serie, count(*)
            FROM cne.mjrv m JOIN cne.juntas_madrid j ON j.id = m.junta_origen_id
           WHERE m.activo GROUP BY 1, 2 ORDER BY 1, 2;
          SELECT 'Cola | canal | estado | línea | rectificación | cuántos';
          SELECT canal, estado, coalesce(linea_whatsapp::text, ''), whatsapp_rectificacion, count(*)
            FROM cne.envios_credencial WHERE NOT simulado GROUP BY 1, 2, 3, 4 ORDER BY 1, 2, 3, 4;
          SELECT 'Actas y archivos previos al despliegue F/M | modo | emitidas | PDF cifrado | pagadas | firmas PDF';
          SELECT CASE WHEN a.es_prueba THEN 'prueba' ELSE 'elección' END, count(*),
                 count(*) FILTER (WHERE a.recibo_cifrado IS NOT NULL AND a.recibo_nonce IS NOT NULL),
                 count(*) FILTER (WHERE EXISTS (SELECT 1 FROM cne.pagos_confirmados p WHERE p.acta_id = a.id)),
                 (SELECT count(*) FROM cne.firmas_recibo f WHERE f.es_prueba = a.es_prueba AND f.creado_en < timestamptz '2026-11-24 12:16:55 Europe/Madrid')
            FROM cne.actas_pago a WHERE a.creado_en < timestamptz '2026-11-24 12:16:55 Europe/Madrid'
           GROUP BY a.es_prueba ORDER BY 1;
          SELECT 'Totales previos al despliegue F/M | actas | PDF cifrado | firmas PDF';
          SELECT count(*), count(*) FILTER (WHERE a.recibo_cifrado IS NOT NULL AND a.recibo_nonce IS NOT NULL),
                 (SELECT count(*) FROM cne.firmas_recibo WHERE creado_en < timestamptz '2026-11-24 12:16:55 Europe/Madrid')
            FROM cne.actas_pago a WHERE a.creado_en < timestamptz '2026-11-24 12:16:55 Europe/Madrid';
          COMMIT;
          SQL
          rm -f ~/.ssh/oracle
