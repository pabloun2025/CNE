name: Prueba individual con el padrón de 39235
on:
  workflow_dispatch:
    inputs:
      modo:
        type: choice
        options: [preparar, enviar, limpiar]
        required: true
permissions:
  contents: read
concurrency:
  group: cne-sms-prueba-padron-39235-madrid-20261127
  cancel-in-progress: false
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar la prueba individual
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          API_SMSQUEENS: ${{ secrets.API_SMSQUEENS }}
          MODO: ${{ inputs.modo }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ORACLE_SSH_KEY"
          t=$(mktemp -d)
          trap 'rm -rf -- "$t"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$t/ssh"
          oracle=(ssh -i "$t/ssh" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109)
          case "$MODO" in
            preparar)
              "${oracle[@]}" 'set -eu; umask 077; clave=/tmp/cne-sms-prueba-padron-39235-20261127; mkdir -p "$clave"; test ! -e "$clave/solicitado"; if [ ! -s "$clave/publica.pem" ]; then openssl req -x509 -newkey rsa:3072 -keyout "$clave/privada.pem" -out "$clave/publica.pem" -days 1 -nodes -subj /CN=CNE-SMS-PADRON-39235 >/dev/null 2>&1; fi; cat "$clave/publica.pem"'
              ;;
            enviar)
              [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
              test -n "$API_SMSQUEENS"
              printf '%s' "$API_SMSQUEENS" > "$t/sms.key"
              cp scripts/ops/sms-prueba-mesa/{enviar-oracle.sh,prueba.mjs,prueba.cms} "$t/"
              tar -C "$t" -cf - enviar-oracle.sh prueba.mjs prueba.cms sms.key |
                "${oracle[@]}" 'set -eu; umask 077; carpeta=$(mktemp -d); trap '\''rm -rf -- "$carpeta"'\'' EXIT; tar -xf - -C "$carpeta"; bash "$carpeta/enviar-oracle.sh" "$carpeta"'
              ;;
            limpiar)
              "${oracle[@]}" 'set -eu; rm -f /tmp/cne-sms-prueba-padron-39235-20261127/privada.pem /tmp/cne-sms-prueba-padron-39235-20261127/publica.pem'
              ;;
          esac
