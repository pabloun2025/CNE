name: Marcar documento de F44 para repetir
on:
  workflow_dispatch:
    inputs:
      modo:
        required: true
        type: choice
        options: [clave, ejecutar, limpiar]
      paquete:
        description: Paquete cifrado de la ficha
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: revision-f44
  cancel-in-progress: false
jobs:
  padron:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar en Oracle
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          MODO: ${{ inputs.modo }}
          PAQUETE: ${{ inputs.paquete }}
        run: |
          set -euo pipefail
          umask 077
          clave=$(mktemp)
          trap 'unlink "$clave"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$clave"
          case "$MODO" in
            ejecutar) test -n "$PAQUETE"; printf '%s' "$PAQUETE" | base64 -d > madrid.cms ;;
            clave|limpiar) touch madrid.cms ;;
            *) exit 1 ;;
          esac
          remoto='set -eu; umask 077; t=$(mktemp -d); trap '"'"'for p in "$t"/*; do unlink "$p"; done; rmdir "$t"'"'"' EXIT; tar -xf - -C "$t"; bash "$t/remoto-cotejo.sh" "$t" '
          tar -cf - remoto-cotejo.sh aplicar-cotejo.ts madrid.cms | ssh -i "$clave" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109 "$remoto$MODO"
