name: Envío de juntas del padrón con saldo disponible
on:
  workflow_dispatch:
    inputs:
      modo:
        type: choice
        options: [preparar, enviar, estado, limpiar]
        required: true
permissions:
  contents: read
concurrency:
  group: cne-sms-juntas-39235-20261127
  cancel-in-progress: false
jobs:
  lote:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar la operación autorizada
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          API_SMSQUEENS: ${{ secrets.API_SMSQUEENS }}
          MODO: ${{ inputs.modo }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ORACLE_SSH_KEY"
          t=$(mktemp -d)
          trap 'rm -rf -- "$t"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$t/ssh"
          oracle=(ssh -i "$t/ssh" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109)
          case "$MODO" in
            preparar)
              "${oracle[@]}" 'set -eu; umask 077; p=/tmp/cne-sms-juntas-39235-20261127; mkdir -p "$p"; if [ ! -s "$p/publica.pem" ]; then openssl req -x509 -newkey rsa:3072 -keyout "$p/privada.pem" -out "$p/publica.pem" -days 1 -nodes -subj /CN=CNE-SMS-JUNTAS-39235 >/dev/null 2>&1; fi; cat "$p/publica.pem"'
              ;;
            enviar|estado)
              [[ "$MODO" != enviar || "$GITHUB_RUN_ATTEMPT" == 1 ]]
              base=scripts/ops/sms-juntas-39235
              cp "$base/oracle.sh" "$base/respuesta.crt" "$t/"
              partes=(oracle.sh respuesta.crt)
              if [[ "$MODO" == enviar ]]; then
                test -n "$API_SMSQUEENS"
                printf '%s' "$API_SMSQUEENS" > "$t/sms.key"
                cp "$base/envio.mjs" "$base/lote.cms" "$t/"
                partes+=(envio.mjs lote.cms sms.key)
              fi
              tar -C "$t" -cf - "${partes[@]}" |
                "${oracle[@]}" 'set -eu; umask 077; carpeta=$(mktemp -d); trap '\''rm -rf -- "$carpeta"'\'' EXIT; tar -xf - -C "$carpeta"; bash "$carpeta/oracle.sh" "$carpeta" '"$MODO"
              ;;
            limpiar)
              "${oracle[@]}" 'set -eu; p=/tmp/cne-sms-juntas-39235-20261127; rm -f "$p/privada.pem" "$p/publica.pem"'
              ;;
          esac
