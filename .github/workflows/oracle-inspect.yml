name: Completar F11 y M23 del padrón de Madrid
on:
  workflow_dispatch:
    inputs:
      modo:
        required: true
        type: choice
        options: [clave, comprobar, ejecutar, estado, limpiar]
      paquete:
        description: Paquete cifrado para comprobar o ejecutar
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: cotejo-madrid-f11-m23
  cancel-in-progress: false
jobs:
  padron:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar en Oracle
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          API_SMSQUEENS: ${{ secrets.API_SMSQUEENS }}
          MODO: ${{ inputs.modo }}
          PAQUETE: ${{ inputs.paquete }}
        run: |
          set -euo pipefail
          umask 077
          clave=$(mktemp)
          trap 'unlink "$clave"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$clave"
          case "$MODO" in
            comprobar|ejecutar) test -n "$PAQUETE"; printf '%s' "$PAQUETE" | base64 -d > madrid.cms ;;
            clave|estado|limpiar) touch madrid.cms ;;
            *) exit 1 ;;
          esac
          remoto='set -eu; umask 077; t=$(mktemp -d); trap '"'"'for p in "$t"/*; do unlink "$p"; done; rmdir "$t"'"'"' EXIT; tar -xf - -C "$t"; bash "$t/remoto-cotejo.sh" "$t" '
          printf "%s" "$API_SMSQUEENS" > sms.key
          tar -cf - remoto-cotejo.sh aplicar-cotejo.ts madrid.cms sms.key | ssh -i "$clave" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109 "$remoto$MODO"
