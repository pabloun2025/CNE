name: Verificación privada de campos para una vista previa
on:
  workflow_dispatch:
    inputs:
      modo:
        type: choice
        options: [preparar, consultar, limpiar]
        required: true
permissions:
  contents: read
concurrency:
  group: cne-previa-campos-madrid-20261127
  cancel-in-progress: false
jobs:
  consulta:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verificar los campos con cifrado
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          MODO: ${{ inputs.modo }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ORACLE_SSH_KEY"
          t=$(mktemp -d)
          trap 'rm -rf -- "$t"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$t/ssh"
          oracle=(ssh -i "$t/ssh" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109)
          case "$MODO" in
            preparar)
              "${oracle[@]}" 'set -eu; umask 077; clave=/tmp/cne-vista-previa-campos-20261127; mkdir -p "$clave"; if [ ! -s "$clave/publica.pem" ]; then openssl req -x509 -newkey rsa:3072 -keyout "$clave/privada.pem" -out "$clave/publica.pem" -days 1 -nodes -subj /CN=CNE-PREVIA-MADRID >/dev/null 2>&1; fi; cat "$clave/publica.pem"'
              ;;
            consultar)
              tar -C scripts/ops/previa-colegas -cf - consulta.cms respuesta.pem consultar.sh |
                "${oracle[@]}" 'set -eu; umask 077; carpeta=$(mktemp -d); trap '\''rm -rf -- "$carpeta"'\'' EXIT; tar -xf - -C "$carpeta"; bash "$carpeta/consultar.sh" "$carpeta"'
              ;;
            limpiar)
              "${oracle[@]}" 'set -eu; clave=/tmp/cne-vista-previa-campos-20261127; rm -f "$clave/privada.pem" "$clave/publica.pem"; rmdir "$clave"'
              ;;
          esac
