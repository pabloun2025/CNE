name: Consulta de saldo para el lote de SMS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Consultar saldo y tarifa de España
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          API_SMSQUEENS: ${{ secrets.API_SMSQUEENS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ORACLE_SSH_KEY"
          test -n "$API_SMSQUEENS"
          carpeta=$(mktemp -d)
          trap 'rm -rf -- "$carpeta"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$carpeta/oracle"
          printf '%s' "$API_SMSQUEENS" > "$carpeta/sms.key"
          cp scripts/ops/saldo-39235/consultar.mjs "$carpeta/"
          tar -C "$carpeta" -cf - consultar.mjs sms.key |
            ssh -i "$carpeta/oracle" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109 \
              'sudo docker exec -i cne-prod-cne-app-1 sh -c "set -eu; umask 077; directorio=\$(mktemp -d); trap '\''rm -rf -- \"\$directorio\"'\'' EXIT; cd \"\$directorio\"; tar -xf -; node consultar.mjs"'
