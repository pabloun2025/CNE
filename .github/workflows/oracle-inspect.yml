name: Primer envío de la landing de Madrid del 29N
on:
  workflow_dispatch:
    inputs:
      modo:
        type: choice
        options: [comprobar, enviar, reconciliar, consultar, limpiar]
        required: true
        default: comprobar
permissions:
  contents: read
concurrency:
  group: cne-madrid-29n-primer-envio
  cancel-in-progress: false
jobs:
  envio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Operar el lote autorizado en SMS Publi
        env:
          API_SMSQUEENS: ${{ secrets.API_SMSQUEENS }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          MODO: ${{ inputs.modo }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$API_SMSQUEENS"
          test -n "$ORACLE_SSH_KEY"
          case "$MODO" in comprobar|enviar|reconciliar|consultar|limpiar) ;; *) exit 2 ;; esac
          t=$(mktemp -d)
          trap 'rm -rf -- "$t"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$t/oracle"
          printf '%s' "$API_SMSQUEENS" > "$t/sms.key"
          cp scripts/ops/sms-madrid-29n.mjs scripts/ops/sms-madrid-29n-oracle.sh "$t/"
          if [[ "$MODO" == enviar ]]; then
            test "$GITHUB_RUN_ATTEMPT" = 1
            cp scripts/ops/sms-madrid-29n.cms "$t/lista.cms"
          else
            touch "$t/lista.cms"
          fi
          comando='set -eu; umask 077; t=$(mktemp -d); trap '\''rm -rf -- "$t"'\'' EXIT; tar -xf - -C "$t"; bash "$t/sms-madrid-29n-oracle.sh" "$t" '
          tar -C "$t" -cf - sms-madrid-29n.mjs sms-madrid-29n-oracle.sh sms.key lista.cms |
            ssh -i "$t/oracle" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109 "$comando$MODO"
