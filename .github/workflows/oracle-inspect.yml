name: Preparar la clase de Google Wallet de CNE

on: workflow_dispatch

permissions:
  contents: read

jobs:
  preparar:
    if: github.ref == 'refs/heads/ops/preparar-emisor-wallet-cne'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar el emisor institucional y preparar la clase de CNE
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          llave=$(mktemp)
          trap 'rm -f -- "$llave"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$llave"
          ssh -i "$llave" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109 \
            'sudo docker exec -i teinvito-prod-app-1 node -' <<'JS'
          const { createSign } = require("node:crypto");
          async function preparar() {
            const emisor = process.env.GOOGLE_WALLET_ISSUER_ID?.trim();
            const cuenta = process.env.GOOGLE_WALLET_SERVICE_ACCOUNT_EMAIL?.trim();
            const clave = process.env.GOOGLE_WALLET_PRIVATE_KEY?.trim().replace(/\\n/g, "\n");
            if (!emisor || !/^\d+$/.test(emisor) || !cuenta || !clave) throw Error("Falta la configuración institucional.");
            const codificar = x => Buffer.from(JSON.stringify(x)).toString("base64url");
            const ahora = Math.floor(Date.now() / 1000);
            const url = "https://oauth2.googleapis.com/token";
            const datos = codificar({alg:"RS256",typ:"JWT"}) + "." + codificar({iss:cuenta,aud:url,scope:"https://www.googleapis.com/auth/wallet_object.issuer",iat:ahora,exp:ahora+300});
            const assertion = datos + "." + createSign("RSA-SHA256").update(datos).sign(clave).toString("base64url");
            const r = await fetch(url, {
              method:"POST", body:new URLSearchParams({grant_type:"urn:ietf:params:oauth:grant-type:jwt-bearer",assertion}), signal:AbortSignal.timeout(15000),
            });
            if (!r.ok) throw Error("Google rechazó la autenticación del emisor (HTTP " + r.status + ").");
            const accessToken = (await r.json()).access_token;
            if (typeof accessToken !== "string") throw Error("Google no devolvió una credencial temporal.");
            const headers = {authorization:"Bearer " + accessToken,"content-type":"application/json"};
            const clase = emisor + ".cne_madrid_mjrv_2026_v1";
            const coleccion = "https://walletobjects.googleapis.com/walletobjects/v1/genericClass";
            const leer = () => fetch(coleccion + "/" + encodeURIComponent(clase), {headers,signal:AbortSignal.timeout(15000)});
            const encontrada = await leer();
            if (encontrada.status === 404) {
              const creada = await fetch(coleccion, {method:"POST",headers,body:JSON.stringify({id:clase}),signal:AbortSignal.timeout(15000)});
              if (!creada.ok && creada.status !== 409) throw Error("Google rechazó la clase de CNE (HTTP " + creada.status + ").");
              if (!(await leer()).ok) throw Error("Google no confirmó la clase de pases.");
            } else if (!encontrada.ok) {
              throw Error("Google no permitió consultar la clase de CNE (HTTP " + encontrada.status + ").");
            }
            console.log("Emisor institucional autenticado. Clase de credenciales de CNE verificada en Google Wallet.");
          }
          void preparar().catch(error => {console.error(error.message);process.exitCode=1;});
          JS
