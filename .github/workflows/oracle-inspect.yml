name: Verificar el enlace vigente de Documentación
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consulta:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Recuperar exclusivamente el enlace de Documentación en forma cifrada
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ORACLE_SSH_KEY"
          clave=$(mktemp)
          trap 'rm -f "$clave"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$clave"
          ssh -i "$clave" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109 \
            'sudo docker exec -i cne-prod-cne-app-1 node --import tsx -' < scripts/ops/consulta-enlace-documentacion.cjs
