name: Prueba individual de la landing de Madrid en SMS Publi
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cne-sms-landing-54298-prueba
  cancel-in-progress: false
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validar la plantilla y enviar un SMS de prueba
        env:
          API_SMSQUEENS: ${{ secrets.API_SMSQUEENS }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          node scripts/ops/prueba-sms-landing-54298.mjs
