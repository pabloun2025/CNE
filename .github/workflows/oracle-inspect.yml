name: Enviar una prueba del mailing de Madrid por Brevo
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cne-madrid-prueba-mailing-20261126
  cancel-in-progress: false
jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Enviar un único correo de revisión
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          test -n "$ORACLE_SSH_KEY"
          clave=$(mktemp)
          trap 'unlink "$clave"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$clave"
          tar -C scripts/ops/mailing-madrid -cf - enviar-prueba.mjs mailing-madrid.html mailing-madrid.json |
            ssh -i "$clave" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109 \
            'sudo docker exec -i cne-prod-cne-app-1 sh -c "set -eu; umask 077; directorio=\$(mktemp -d); trap '\''rm -rf -- \"\$directorio\"'\'' EXIT; cd \"\$directorio\"; tar -xf -; node enviar-prueba.mjs"'
