name: Emitir dos enlaces temporales para puestos MJRV
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: emitir-enlaces-puestos-mjrv
  cancel-in-progress: false
jobs:
  emitir:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Emitir únicamente los dos enlaces revocables
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$ORACLE_SSH_KEY"
          clave=$(mktemp)
          trap 'rm -f "$clave"' EXIT
          printf '%s\n' "$ORACLE_SSH_KEY" > "$clave"
          ssh -i "$clave" -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109 \
            'sudo docker exec -i cne-prod-cne-app-1 node --import tsx -' < scripts/ops/emitir-enlaces-puestos.cjs
