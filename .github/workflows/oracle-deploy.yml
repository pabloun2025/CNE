name: Deploy to Oracle

# Publica CNE en la VM compartida (carpeta /home/ubuntu/cne, proyecto Compose cne-prod).
# Solo necesita el secreto ORACLE_SSH_KEY. APP_MASTER_KEY y la contraseña inicial de la superadmin
# se generan en el servidor la primera vez si no existen como secretos; nunca se imprimen.
on:
  push:
    tags:
      - cne-voto-publicacion-20261129-r2
      - cne-zip-privado-20261126
      - cne-zip-ventanilla-ajustes-20261126
      - cne-zip-padron-corregido-20261126
      - cne-zip-impresion-control-20261126
      - cne-zip-pos80c-20261126
      - cne-zip-produccion-20261126
      - cne-puesto-movil-20261126
      - cne-puesto-movil-correo-20261126
      - cne-movil-pdf-dominio-20261126
      - cne-windows-margenes-20261126
  workflow_dispatch:
    inputs:
      accion:
        description: "desplegar = publicar main; revertir = volver a la imagen anterior"
        required: true
        default: desplegar
        type: choice
        options: [desplegar, revertir]
      host_madrid:
        description: "Host público (por defecto madrid.consulado.app)"
        required: false
        default: "madrid.consulado.app"
      superadmin_email:
        description: "Correo de la superadmin (opcional; si falta, secreto SUPERADMIN_EMAIL o pabloun@gmail.com)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: oracle-deploy
  cancel-in-progress: false

jobs:
  ci:
    if: ${{ github.event_name == 'push' || inputs.accion == 'desplegar' }}
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # «revertir» no pasa por CI (el trabajo ci se omite); «desplegar» exige CI en verde.
    if: ${{ !cancelled() && (needs.ci.result == 'success' || inputs.accion == 'revertir') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Solo desde main
        if: ${{ inputs.accion == 'desplegar' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Producción solo se publica desde main."
          exit 1

      - uses: actions/checkout@v4

      - name: Verificar que la etiqueta apunta a main
        if: ${{ github.event_name == 'push' }}
        run: |
          test "$GITHUB_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"

      - name: Preparar clave SSH y paquete protegido
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          APP_MASTER_KEY: ${{ secrets.APP_MASTER_KEY }}
          SMSPUBLI_API: ${{ secrets.SMSPUBLI_API }}
          SUPERADMIN_EMAIL: ${{ inputs.superadmin_email || secrets.SUPERADMIN_EMAIL }}
          HOST_MADRID: ${{ inputs.host_madrid || vars.HOST_MADRID || 'madrid.consulado.app' }}
          APP_VERSION: ${{ github.sha }}
        run: |
          set +x
          test -n "$ORACLE_SSH_KEY" || { echo "Falta el secreto ORACLE_SSH_KEY en pabloun2025/CNE"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle
          # Las entradas vacías se omiten: el servidor genera o conserva lo que falte.
          jq -n '{APP_MASTER_KEY: env.APP_MASTER_KEY, SMSPUBLI_API: env.SMSPUBLI_API, SUPERADMIN_EMAIL: env.SUPERADMIN_EMAIL, HOST_MADRID: env.HOST_MADRID, APP_VERSION: env.APP_VERSION} | with_entries(select(.value != null and .value != ""))' > /tmp/cne-bootstrap.json
          chmod 600 /tmp/cne-bootstrap.json

      - name: Instalar y verificar CNE
        env:
          ACCION: ${{ inputs.accion || 'desplegar' }}
        run: |
          set +x
          SSH=(ssh -i ~/.ssh/oracle -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109)
          SCP=(scp -i ~/.ssh/oracle -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          if [ "$ACCION" = revertir ]; then
            "${SSH[@]}" 'cd /home/ubuntu/cne && chmod +x scripts/deploy-oracle.sh && ./scripts/deploy-oracle.sh revertir'
            exit 0
          fi
          tar \
            --exclude=.git \
            --exclude=.next \
            --exclude=.env.production \
            --exclude='.env' \
            --exclude=node_modules \
            --exclude=backups \
            -czf /tmp/cne-source.tar.gz .
          "${SSH[@]}" 'set -e; install -d -m 700 /home/ubuntu/cne; find /home/ubuntu/cne -mindepth 1 -maxdepth 1 ! -name .env.production ! -name backups -exec rm -rf {} +'
          "${SCP[@]}" /tmp/cne-source.tar.gz ubuntu@51.170.51.109:/tmp/cne-source.tar.gz
          "${SSH[@]}" 'tar -xzf /tmp/cne-source.tar.gz -C /home/ubuntu/cne; rm -f /tmp/cne-source.tar.gz'
          "${SCP[@]}" /tmp/cne-bootstrap.json ubuntu@51.170.51.109:/tmp/cne-bootstrap.json
          "${SSH[@]}" 'chmod 600 /tmp/cne-bootstrap.json; cd /home/ubuntu/cne; chmod +x scripts/deploy-oracle.sh; ./scripts/deploy-oracle.sh desplegar'

      - name: Borrar archivos temporales
        if: always()
        run: rm -f ~/.ssh/oracle /tmp/cne-bootstrap.json /tmp/cne-source.tar.gz

  dominio-puesto-movil:
    if: ${{ github.ref == 'refs/tags/cne-movil-pdf-dominio-20261126' }}
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Activar el dominio del puesto móvil
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/cloudflare-dominio.py crear cne.consulado.app consulado.app madrid.consulado.app

  verificar-enlaces-electorales:
    if: ${{ always() && github.ref == 'refs/tags/cne-voto-publicacion-20261129-r2' }}
    needs: [ci, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar guía y justificante desde internet
        env:
          RESULTADO_CI: ${{ needs.ci.result }}
          RESULTADO_DESPLIEGUE: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          test "$RESULTADO_CI" = success && test "$RESULTADO_DESPLIEGUE" = success
          site=https://madrid.consulado.app
          curl --retry 4 --retry-delay 3 --max-time 15 -fsSL "$site/justificante-laboral" -o /tmp/cne-justificante.html
          grep -qi 'Justificante laboral' /tmp/cne-justificante.html
          curl --retry 4 --retry-delay 3 --max-time 15 -fsSL "$site/guia-electoral.pdf" -o /tmp/cne-guia.pdf
          cmp /tmp/cne-guia.pdf public/guia-electoral.pdf
          curl --retry 4 --retry-delay 3 --max-time 15 -fsSL "$site/api/voto/clave-publica" -o /tmp/cne-receptor.pem
          openssl pkey -pubin -in /tmp/cne-receptor.pem -outform DER -out /tmp/cne-receptor.der
          test "$(wc -c </tmp/cne-receptor.der)" -eq 44
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'revision %s\nreceptor %s\nguia %s\n' "$GITHUB_SHA" "$(base64 -w0 /tmp/cne-receptor.der)" "$(sha256sum /tmp/cne-guia.pdf | cut -d ' ' -f1)" > /tmp/cne-voto-verificacion.txt
          git tag -a cne-voto-verificado-20261129-r2 -F /tmp/cne-voto-verificacion.txt "$GITHUB_SHA"
          git push origin refs/tags/cne-voto-verificado-20261129-r2
      - name: Registrar un fallo de publicación
        if: ${{ failure() }}
        env:
          RESULTADO_CI: ${{ needs.ci.result }}
          RESULTADO_DESPLIEGUE: ${{ needs.deploy.result }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          etiqueta="cne-voto-estado-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mensaje="CI: $RESULTADO_CI. Despliegue: $RESULTADO_DESPLIEGUE. Verificación pública: fallida."
          git tag -a "$etiqueta" -m "$mensaje" "$GITHUB_SHA"
          git push origin "refs/tags/$etiqueta"
