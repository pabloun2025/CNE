name: Recuperar acceso SUPERADMIN

# Solo se ejecuta a petición explícita desde Actions en main.
# La contraseña se configura como secreto de repositorio:
# CNE_SUPERADMIN_TEMP_PASSWORD
# Nunca usar workflow inputs para la contraseña: se mostrarían en la ejecución.
on:
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escriba exactamente RESTABLECER SUPERADMIN'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: cne-recuperacion-superadmin
  cancel-in-progress: false

jobs:
  recuperar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Preparar acceso seguro (sin mostrar contraseñas)
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          RESET_PASSWORD: ${{ secrets.CNE_SUPERADMIN_TEMP_PASSWORD }}
          CONFIRMACION: ${{ inputs.confirmacion }}
        run: |
          set -euo pipefail
          set +x
          if [ "$CONFIRMACION" != "RESTABLECER SUPERADMIN" ]; then
            echo "Confirmación incorrecta: no se modificó nada."
            exit 1
          fi
          if [ -z "$ORACLE_SSH_KEY" ]; then
            echo "Falta el secreto existente ORACLE_SSH_KEY."
            exit 1
          fi
          if [ "${#RESET_PASSWORD}" -lt 12 ] || [ "${#RESET_PASSWORD}" -gt 200 ]; then
            echo "Defina el secreto CNE_SUPERADMIN_TEMP_PASSWORD con 12 a 200 caracteres."
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/oracle
          chmod 600 ~/.ssh/oracle

      - name: Restablecer exclusivamente la cuenta superadmin
        env:
          RESET_PASSWORD: ${{ secrets.CNE_SUPERADMIN_TEMP_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          SSH=(ssh -i ~/.ssh/oracle -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new ubuntu@51.170.51.109)
          SCP=(scp -i ~/.ssh/oracle -o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)
          limpiar() {
            "${SSH[@]}" 'rm -f /tmp/cne-reset-superadmin.cjs' >/dev/null 2>&1 || true
          }
          trap limpiar EXIT
          "${SCP[@]}" scripts/ops/reset-superadmin.cjs ubuntu@51.170.51.109:/tmp/cne-reset-superadmin.cjs
          # La contraseña viaja únicamente por stdin (no por argumentos de procesos,
          # archivos, logs o un input de Actions). El script no la imprime.
          printf '%s' "$RESET_PASSWORD" | "${SSH[@]}" \
            'sudo docker exec -i -w /app cne-prod-cne-app-1 node -e "$(cat /tmp/cne-reset-superadmin.cjs)"'

      - name: Eliminar clave SSH temporal
        if: always()
        run: rm -f ~/.ssh/oracle
